name: Build and Run Math Distillation Notebook

on:
  push:
    branches: [ main ]

jobs:
  execute-notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jupyter nbconvert

    - name: Validate Notebook JSON
      run: |
        python -c "import json; json.load(open('math_distill_colab.ipynb')); print('JSON OK')"

    - name: Re-save notebook
      run: |
        jupyter nbconvert --to notebook math_distill_colab.ipynb --output executed_notebook.ipynb

    - name: Upload notebook
      uses: actions/upload-artifact@v4
      with:
        name: executed-notebook
        path: executed_notebook.ipynb
